server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same origin for the browser: the API is reached only through this proxy (port 8000 is closed on EC2).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
