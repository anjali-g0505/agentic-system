name: rupay-chargeback-desk

x-app: &app
  build:
    context: .
    args:
      BASE_IMAGE: ${BASE_IMAGE}
  image: rupay-chargeback-api:1.0
  env_file: .env
  environment:
    - GROQ_API_KEY=${GROQ_API_KEY}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./data/seed_cases.sql:/docker-entrypoint-initdb.d/02_seed_cases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: rupay-chargeback-ui:1.0
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    <<: *app
    profiles: ["tools"]
    environment: []   # ingestion never calls Groq, so it does not receive the key
    command: ["python", "-m", "ingest.run"]
    volumes:
      - ./data:/app/data:ro
      - ingest_out:/app/ingest_out

volumes:
  pgdata:
  ingest_out:
